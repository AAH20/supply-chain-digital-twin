name: Supply chain digital twin CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: supplytwin examples/global-manufacturer/disruption.json --output generated/global-manufacturer
      - run: git diff --exit-code generated/global-manufacturer
      - run: python -m compileall -q src tests
      - uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/azure/main.bicep --outfile /tmp/main.json
