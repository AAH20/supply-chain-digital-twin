[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplytwin-ai"
version = "0.1.0"
description = "Supply chain digital twin, demand forecasting, inventory optimization and working-capital economics"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
supplytwin = "supplytwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
